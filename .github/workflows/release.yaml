name: Compilación

permissions:
  contents: write

on:
  push:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Compilar 3dsx y cia
        run: |
          chmod +x buildtools/*
          make 3dsx cia
      
      - name: Subir release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          prerelease: true
          files: |
            output/Impostor3DS.3dsx
            output/Impostor3DS.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
